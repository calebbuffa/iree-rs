[package]
name = "ireetok"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rust API for the IREE tokenizer"
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ireetok"
include = ["src/**", "tests/**", "README.md", "Cargo.toml", "clippy.toml", "LICENSE"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
iree-native = { version = "0.1.0", default-features = false, features = [
    "tokenizer",
] }

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
