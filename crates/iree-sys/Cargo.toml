[package]
name = "iree-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 WITH LLVM-exception"
description = "Version-locked native IREE bindings and Woodshed source provisioning"
readme = "README.md"
links = "iree_runtime"
include = [
    "src/**",
    "native/**",
    "tests/**",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "LICENSE-LLVM-EXCEPTION",
    "NOTICE",
]

[features]
default = ["cpu"]
cpu = ["local-sync", "local-task"]
local-sync = []
local-task = ["task"]
task = []
vulkan = []
cuda = []
hip = []
amdgpu = []
metal = []
null = []
webgpu = []
compiler = ["input-stablehlo"]
target-llvm-cpu = ["compiler"]
target-vulkan = ["compiler"]
target-cuda = ["compiler"]
target-rocm = ["compiler"]
target-metal = ["compiler"]
target-webgpu = ["compiler"]
target-wasm = ["target-llvm-cpu"]
llvm-aarch64 = ["target-llvm-cpu"]
llvm-arm = ["target-llvm-cpu"]
llvm-riscv = ["target-llvm-cpu"]
llvm-x86 = ["target-llvm-cpu"]
llvm-webassembly = ["target-wasm"]
input-stablehlo = []
input-tosa = ["compiler"]
input-torch = ["compiler"]

[build-dependencies]
bindgen = { version = "=0.72.1", features = ["experimental"] }
regex = "1"
cc = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
woodshed = { version = "0.2.3", features = ["cmake", "zip"] }

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["compiler", "vulkan"]
