[package]
name = "iree-samples"
description = "Ports of IREE's upstream samples (extern/iree/samples) to the Rust API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autoexamples = false
autotests = false
autobins = false

[features]
default = ["local-task"]
local-sync = ["ireert/local-sync"]
local-task = ["ireert/local-task"]
io-parameters = ["ireert/io-parameters"]
vulkan = ["ireert/vulkan", "ireec/target-vulkan"]
cuda = ["ireert/cuda", "ireec/target-cuda"]
llvm-cpu = ["ireec/target-llvm-cpu"]
stablehlo = ["ireec/input-stablehlo"]
tokenizer = ["dep:ireetok"]
vulkan-compiler = ["ireec/target-vulkan"]

[dependencies]
ireert = { version = "0.1.0", path = "../crates/ireert" }
ireec = { version = "0.1.0", path = "../crates/ireec" }
iree-sample-dynamic-module = { version = "0.1.0", path = "custom_module/dynamic-module" }
image = { version = "0.25", default-features = false, features = ["png"] }
ireetok = { version = "0.1.0", path = "../crates/ireetok", optional = true }

[lints]
workspace = true

# Every example sets `test = true` and wraps `main` in a `#[test]`, so
# `cargo test -p iree-samples --examples` runs the whole suite.

