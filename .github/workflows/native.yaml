name: Native builds and deployment

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Native tools
        run: |
          if ($IsLinux) {
            sudo apt-get update -qq
            sudo apt-get install -y ninja-build clang libclang-dev
          } elseif ($IsMacOS) {
            brew install llvm ninja
            "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $env:GITHUB_ENV
          } else {
            'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> $env:GITHUB_ENV
          }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/woodshed
            target
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'crates/iree-sys/native/**') }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-
      - name: Runtime and generated APIs
        run: |
          cargo test -p iree-sys --no-default-features
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test -p iree-sys -p iree
          exit $LASTEXITCODE
      - name: Compiler and CPU execution
        run: |
          cargo test -p iree-sys -p iree --features iree/compiler
          exit $LASTEXITCODE
      - name: GPU-only compiler without CPU linker helper
        run: |
          cargo test -p iree-sys --no-default-features --features compiler,target-vulkan
          exit $LASTEXITCODE
      - name: Additional native drivers
        run: |
          $drivers = if ($IsMacOS) { "metal,null" } elseif ($IsLinux) { "hip,amdgpu,null" } else { "hip,null" }
          cargo test -p iree-sys --no-default-features --features $drivers
          exit $LASTEXITCODE
      - name: Relocated compiler and runtime deployment
        run: |
          $bundleRoot = Join-Path $env:RUNNER_TEMP "iree-deployment"
          $compiler = Join-Path $bundleRoot "compiler"
          $runtime = Join-Path $bundleRoot "runtime"
          cargo xtask package $compiler -- -p iree --example compile --features compiler
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo xtask package $runtime -- -p iree --example runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $model = (Resolve-Path crates\iree\examples\models\add.mlir).Path
          $vmfb = Join-Path $bundleRoot "add.vmfb"
          $extension = if ($IsWindows) { ".exe" } else { "" }
          foreach ($name in @("LD_LIBRARY_PATH", "DYLD_LIBRARY_PATH", "DYLD_FALLBACK_LIBRARY_PATH",
              "LIB_IREE_COMPILER", "IREE_DIR", "IREE_COMPILER_BIN_DIR", "PYTHONPATH")) {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }
          $env:PATH = if ($IsWindows) { "$env:SystemRoot\system32;$env:SystemRoot" } else { "/usr/bin:/bin" }
          Set-Location $bundleRoot
          & (Join-Path $compiler "compile$extension") $model $vmfb
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & (Join-Path $runtime "runtime$extension") $vmfb
          exit $LASTEXITCODE
